<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FamilyTasks – Startseite</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            background: #4a7bd8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        a:hover {
            background: #3a66b8;
        }

        .logout {
            background: #d84a4a;
        }

        .logout:hover {
            background: #b83a3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Willkommen, {{ user }}!</h1>

        <p>Was möchtest du tun?</p>

        <a href="/tasks">Aufgaben ansehen</a>
        <a href="/terminal">Admin Terminal</a>
        <a href="/away">Abwesenheit einstellen</a>

        <a class="logout" href="/logout">Abmelden</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Aufgabe bearbeiten</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4a7bd8;
            color: white;
            border: none;
            border-radius: 8px;
        }
        a {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #4a7bd8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Aufgabe bearbeiten</h2>

        <form method="POST">
            <input type="text" name="task" value="{{ task.task }}" required>

            <input type="number" name="points" value="{{ task.points }}" required>

            <select name="assigned_to">
                <option value="">Niemand</option>
                {% for name, data in users.items() %}
                    <option value="{{ name }}" {% if task.assigned_to == name %}selected{% endif %}>
                        {{ name }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Speichern</button>
        </form>

        <a href="/tasks">Zurück</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Terminal</title>

    <style>
        body {
            font-family: Consolas, monospace;
            background: #1e1e1e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .terminal-box {
            background: #2b2b2b;
            padding: 25px;
            border-radius: 10px;
            width: 600px;
            height: 450px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

        h1 {
            margin: 0 0 15px 0;
            text-align: center;
            color: #4a90e2;
        }

        .output {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            white-space: pre-wrap;
            font-size: 14px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #333;
            color: #fff;
            font-size: 15px;
        }

        button {
            padding: 10px 15px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #3a78c2;
        }

        a {
            color: #4a90e2;
            text-decoration: none;
            margin-top: 10px;
            text-align: center;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="terminal-box">
        <h1>Admin Terminal</h1>

        <div class="output">
            {% for line in output %}
                {{ line }}<br>
            {% endfor %}
        </div>

        <form action="/terminal" method="post" class="input-area">
            <input type="text" name="command" placeholder="Befehl eingeben..." required>
            <button type="submit">Ausführen</button>
        </form>

        <a href="/">Zurück zur Startseite</a>
    </div>
</body>
</html>

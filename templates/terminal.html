<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Terminal</title>
    <style>
        #terminal-box {
            width: 600px;
            height: 300px;
            background: black;
            color: lime;
            padding: 10px;
            font-family: monospace;
            overflow-y: auto;
            border: 2px solid #444;
        }
    </style>
</head>
<body>
    <h1>App-Terminal</h1>

    <div id="terminal-box">
        {% for line in output %}
            <div>{{ line }}</div>
        {% endfor %}
    </div>

    <form action="/terminal" method="post">
        <input type="text" name="command" placeholder="Befehl eingeben" required>
        <button type="submit">Ausführen</button>
    </form>

    <p><a href="/">Zurück zur Aufgabenliste</a></p>
</body>
</html>
